<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Speed Orbit Activity | Lunar Descent Guidance HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #020617;
            color: #e2e8f0;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .hud-frame {
            width: 480px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #00f0ff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            letter-spacing: 2px;
            color: #00f0ff;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 8px;
        }

        .viewport {
            height: 160px;
            background: #080d1e;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* Lunar surface SVG */
        svg.lunar-art {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
        }

        /* Lander */
        #lander {
            position: absolute;
            width: 24px;
            height: 24px;
            transition: bottom 0.1s linear;
        }

        .thruster-glow {
            display: none;
            position: absolute;
            bottom: -10px;
            left: 7px;
            width: 10px;
            height: 14px;
            background: radial-gradient(circle, #f97316 0%, transparent 80%);
            border-radius: 50%;
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.8; height: 14px; }
            50% { opacity: 1; height: 18px; }
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #00f0ff;
            width: 100%;
            transition: width 0.1s linear;
        }

        button.burn-btn {
            background: #00f0ff;
            color: #020617;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.1s;
        }

        button.burn-btn:active {
            background: #38bdf8;
            transform: scale(0.98);
        }

        .alert-tag {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            align-self: center;
        }
    </style>
</head>
<body>

    <div class="hud-frame">
        <div class="hud-title">
            <span>ARTEMIS // LUNAR DESCENT</span>
            <span class="alert-tag" id="status-tag">DESCENT NOMINAL</span>
        </div>

        <div class="viewport">
            <svg class="lunar-art" viewBox="0 0 400 60">
                <path d="M0,45 Q70,25 150,40 T300,30 T400,50 L400,60 L0,60 Z" fill="#334155"/>
                <circle cx="200" cy="40" r="15" fill="#1e293b"/>
            </svg>

            <div id="lander" style="bottom: 120px;">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <polygon points="12,2 4,16 20,16" fill="#cbd5e1" stroke="#94a3b8"/>
                    <rect x="7" y="16" width="10" height="4" fill="#64748b"/>
                    <line x1="4" y1="18" x2="1" y2="22" stroke="#94a3b8" stroke-width="2"/>
                    <line x1="20" y1="18" x2="23" y2="22" stroke="#94a3b8" stroke-width="2"/>
                </svg>
                <div class="thruster-glow" id="plume"></div>
            </div>
        </div>

        <div>
            <div class="metric-row">
                <span>RCS PROPELLANT (FUEL)</span>
                <span id="fuel-txt">100%</span>
            </div>
            <div class="bar-container">
                <div class="bar-fill" id="fuel-bar"></div>
            </div>
        </div>

        <div class="metric-row">
            <span>ALTITUDE:</span>
            <span id="alt-txt" style="color: #00f0ff;">120.0 m</span>
        </div>
        <div class="metric-row">
            <span>VERTICAL VELOCITY:</span>
            <span id="vel-txt" style="color: #f59e0b;">-2.4 m/s</span>
        </div>

        <button class="burn-btn" id="burn-btn">HOLD TO FIRE RCS THRUSTER [SPACE]</button>
    </div>

    <script>
        let alt = 120.0;
        let vel = -2.0;
        let fuel = 100.0;
        let burning = false;
        let landed = false;

        const lander = document.getElementById('lander');
        const plume = document.getElementById('plume');
        const fuelBar = document.getElementById('fuel-bar');
        const fuelTxt = document.getElementById('fuel-txt');
        const altTxt = document.getElementById('alt-txt');
        const velTxt = document.getElementById('vel-txt');
        const statusTag = document.getElementById('status-tag');
        const burnBtn = document.getElementById('burn-btn');

        function startBurn() { if (!landed && fuel > 0) burning = true; }
        function stopBurn() { burning = false; }

        burnBtn.addEventListener('mousedown', startBurn);
        window.addEventListener('mouseup', stopBurn);
        window.addEventListener('keydown', (e) => { if (e.code === 'Space') startBurn(); });
        window.addEventListener('keyup', (e) => { if (e.code === 'Space') stopBurn(); });

        setInterval(() => {
            if (landed) return;

            // Physics simulation
            const moonGravity = 0.08;
            const thrust = 0.22;

            if (burning && fuel > 0) {
                vel += (thrust - moonGravity);
                fuel = Math.max(0, fuel - 0.4);
                plume.style.display = 'block';
            } else {
                vel -= moonGravity;
                plume.style.display = 'none';
            }

            alt += vel;

            // Ground touch
            if (alt <= 25) {
                alt = 25;
                landed = true;
                plume.style.display = 'none';
                if (Math.abs(vel) <= 2.2) {
                    statusTag.innerText = 'TOUCHDOWN SUCCESS! 🌕';
                    statusTag.style.background = 'rgba(16, 185, 129, 0.4)';
                    statusTag.style.color = '#34d399';
                } else {
                    statusTag.innerText = 'CRASH LANDING (EXCESS VELOCITY)';
                    statusTag.style.background = 'rgba(239, 68, 68, 0.4)';
                    statusTag.style.color = '#ef4444';
                }
            }

            lander.style.bottom = `${alt}px`;
            altTxt.innerText = `${(alt - 25).toFixed(1)} m`;
            velTxt.innerText = `${vel.toFixed(1)} m/s`;
            velTxt.style.color = Math.abs(vel) > 2.5 ? '#ef4444' : '#34d399';
            fuelTxt.innerText = `${Math.round(fuel)}%`;
            fuelBar.style.width = `${fuel}%`;
            if (fuel < 20) fuelBar.style.background = '#ef4444';
        }, 50);
    </script>
</body>
</html>
